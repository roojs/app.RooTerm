name: Release build

# Tag `vX.Y.Z` (via scripts/release.sh): build Debian + Fedora + AppImage
# packages and publish a GitHub Release whose notes come from CHANGELOG.md.
# Also runnable via workflow_dispatch (artifact upload only when untagged).

run-name: Release build · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: Rebuild sqgipkg / Meson caches from scratch
        type: boolean
        default: false

permissions:
  contents: write

env:
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build-debian:
    name: Build Debian package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          ROOJS_APT_SUITE: plucky
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts meson ninja-build \
            pkg-config valac desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev \
            libgee-0.8-dev libgcrypt20-dev libyaml-dev \
            libjson-glib-dev libsecret-1-dev \
            libsqlite3-dev
          # Noble has no roojs suite. libocsqlite is published for Plucky.
          chmod +x scripts/ci/enable-roojs-apt.sh
          ./scripts/ci/enable-roojs-apt.sh
          sudo apt-get install -y --no-install-recommends libocsqlite-dev
          # Noble’s VTE is 0.76; termprop needs ≥ 0.78 — pull Plucky VTE.
          ./scripts/ci/install-libvte-plucky.sh

      - name: Derive debian/changelog from CHANGELOG.md
        run: |
          set -euo pipefail
          chmod +x scripts/release/derive-changelogs.sh
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./scripts/release/derive-changelogs.sh "${GITHUB_REF_NAME#v}"
          else
            ./scripts/release/derive-changelogs.sh
          fi
          head -1 debian/changelog

      - name: Build .deb
        env:
          DEBFULLNAME: GitHub Actions
          DEBEMAIL: actions@users.noreply.github.com
        run: |
          set -euo pipefail
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          cp ../rooterm_*.deb artifacts/
          ls -lh artifacts

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rooterm-deb
          path: artifacts/*

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      # Fedora container image has no git; checkout needs it.
      - name: Install git
        run: dnf -y install --setopt=install_weak_deps=False git-core ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .rpm
        run: |
          set -euo pipefail
          chmod +x scripts/ci/build-rpm.sh
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./scripts/ci/build-rpm.sh "${GITHUB_REF_NAME#v}"
          else
            ./scripts/ci/build-rpm.sh
          fi

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rooterm-rpm
          path: artifacts/*.rpm

  build-appimage:
    name: Build AppImage ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    # Two runners. One job would add the two builds together; the release
    # clock is whichever one is still running. Cache keys include the arch
    # so the two saves do not reserve the same key.
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout RooTerm
        uses: actions/checkout@v4
        with:
          path: RooTerm

      - name: Restore sqgipkg dependency cache
        uses: actions/cache@v6
        with:
          path: RooTerm/.sqgipkg
          key: sqgipkg-deps-${{ matrix.arch }}-v2-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('RooTerm/sqgipkg.json', 'RooTerm/scripts/release/sqgi.revision') }}
          restore-keys: |
            ${{ inputs.refresh_cache && 'sqgipkg-deps-nocache-' || format('sqgipkg-deps-{0}-v2-stable-', matrix.arch) }}

      # Do not hash RooTerm/** . A sysroot cache under RooTerm/.ci-cache is
      # full of symlinks, and hashFiles walks that on the post step.
      - name: Restore sqgipkg Meson build cache
        uses: actions/cache@v6
        with:
          path: RooTerm/build-linux-${{ matrix.arch }}
          key: sqgipkg-meson-${{ matrix.arch }}-v2-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('RooTerm/src/**/*.vala', 'RooTerm/vapi/**', 'RooTerm/meson.build', 'RooTerm/sqgipkg.json', 'RooTerm/scripts/release/meson-sqgipkg-setup.sh') }}
          restore-keys: |
            ${{ inputs.refresh_cache && 'sqgipkg-meson-nocache-' || format('sqgipkg-meson-{0}-v2-stable-', matrix.arch) }}

      - name: Restore sqgipkg Linux sysroot cache
        id: sqgipkg-sysroot
        uses: actions/cache/restore@v6
        with:
          path: RooTerm/.ci-cache/sqgipkg
          key: sqgipkg-linux-${{ matrix.arch }}-v1-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('RooTerm/sqgipkg.json', 'RooTerm/scripts/release/sqgi.revision') }}
          restore-keys: |
            ${{ inputs.refresh_cache && 'sqgipkg-linux-nocache-' || format('sqgipkg-linux-{0}-v1-stable-', matrix.arch) }}

      - name: Install host build dependencies
        working-directory: RooTerm
        env:
          ROOJS_APT_SUITE: plucky
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git file ca-certificates \
            wget curl meson valac gobject-introspection \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev \
            desktop-file-utils
          # sqgipkg downloads libocsqlite-dev from the roojs archive.
          chmod +x scripts/ci/enable-roojs-apt.sh
          ./scripts/ci/enable-roojs-apt.sh

      - name: Read sqgi revision
        id: sqgi
        working-directory: RooTerm
        run: |
          rev="$(grep -v '^[[:space:]]*#' scripts/release/sqgi.revision | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')"
          if [ -z "$rev" ]; then
            echo "Missing sqgi revision in scripts/release/sqgi.revision" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Checkout sqgi (runtime + sqgipkg)
        uses: actions/checkout@v4
        with:
          repository: supercamel/sqgi
          path: sqgi
          ref: ${{ steps.sqgi.outputs.rev }}

      - name: Restore sqgi build cache
        id: sqgi-build
        uses: actions/cache/restore@v6
        with:
          path: sqgi/build
          key: sqgi-build-v2-${{ hashFiles('RooTerm/scripts/release/sqgi.revision') }}
          restore-keys: sqgi-build-v2-

      - name: Install AppImage build dependencies
        run: |
          extra=""
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            extra="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static binfmt-support"
          fi
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools $extra

      - name: Build and install sqgi
        run: |
          cmake -S sqgi -B sqgi/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSQ_ENABLE_JIT=ON
          cmake --build sqgi/build
          sudo cmake --install sqgi/build --prefix /usr/local
          sudo ldconfig

      - name: Save sqgi build cache
        if: success() && steps.sqgi-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: sqgi/build
          key: ${{ steps.sqgi-build.outputs.cache-primary-key }}

      - name: Build Linux ${{ matrix.arch }} AppImage
        working-directory: RooTerm
        run: |
          chmod +x scripts/release/meson-sqgipkg-setup.sh
          refresh=""
          if [ "${{ inputs.refresh_cache }}" = "true" ]; then
            refresh=--refresh-linux-packages
          fi
          sqgipkg --target appimage --appimage-arch "${{ matrix.arch }}" \
            --sqgi-source-dir "$GITHUB_WORKSPACE/sqgi" \
            --linux-deb-sysroot-cache "$GITHUB_WORKSPACE/RooTerm/.ci-cache/sqgipkg/linux-sysroots" \
            $refresh

      - name: Save sqgipkg Linux sysroot cache
        if: success() && steps.sqgipkg-sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: RooTerm/.ci-cache/sqgipkg
          key: ${{ steps.sqgipkg-sysroot.outputs.cache-primary-key }}

      - name: Collect AppImage artifacts
        working-directory: RooTerm
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "dist-linux-${{ matrix.arch }}/RooTerm.AppImage" \
            "artifacts/RooTerm-${{ matrix.arch }}.AppImage"
          ls -lh artifacts

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rooterm-appimage-${{ matrix.arch }}
          path: RooTerm/artifacts/*

  publish:
    name: Publish release assets
    needs: [build-debian, build-rpm, build-appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          ver="${GITHUB_REF_NAME#v}"
          chmod +x scripts/release/derive-changelogs.sh
          ./scripts/release/derive-changelogs.sh "$ver" --notes notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
          || {
            gh release upload "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md
          }
